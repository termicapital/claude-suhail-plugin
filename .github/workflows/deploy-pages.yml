name: Deploy registration form to GitHub Pages

on:
  push:
    branches: ["claude/gixville-workshop-flyer-XcAjL"]
    paths: ["registration/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload registration folder as site
        uses: actions/upload-pages-artifact@v3
        with:
          path: registration
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
